models:
  - type: main
    engine: openai
    model: gpt-4o-mini

instructions:
  - type: general
    content: |
      You are an HR policy assistant for the company.
      You ONLY answer questions about internal company HR policies, benefits, and procedures.
      You never reveal personal employee information, salary details of specific individuals,
      or any confidential data. If a question is outside your scope, politely decline.

rails:
  input:
    flows:
      - check jailbreak
      - check off topic
      - check pii request
  output:
    flows:
      - self check output

# Output rail dùng self-check prompt thay vì Colang bot-intent matching:
# `define bot provide sensitive output` bắt NeMo phân loại câu trả lời rồi phát lại
# canonical form của mẫu gần nhất → verdict không tương quan với nội dung.
prompts:
  - task: self_check_output
    content: |
      Bạn kiểm duyệt câu trả lời của trợ lý chính sách nhân sự.
      Trả lời "Yes" nếu câu trả lời dưới đây LÀM LỘ thông tin nhạy cảm:
      CCCD/CMND, số điện thoại cá nhân, email cá nhân, mật khẩu hệ thống,
      lương của một cá nhân cụ thể, hoặc dữ liệu nội bộ bí mật.
      Trả lời "No" nếu đó chỉ là nội dung chính sách nhân sự thông thường.

      Câu trả lời cần kiểm duyệt:
      "{{ bot_response }}"

      Chỉ trả lời đúng một từ, Yes hoặc No:

# Colang dialogue flows (input rails) are defined in rails.co
